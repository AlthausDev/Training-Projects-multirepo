version: 2
updates:
  - package-ecosystem: npm
    directory: "/Angular/ANTP-products"
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      angular:
        patterns:
          - "@angular/*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@angular/*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: nuget
    directory: "/C#-GUI-Frameworks/BlazorWebPage/BlazorWebPage/Server"
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
