name: Finish Angular 22 migration

on:
  push:
    branches:
      - security/angular22-migration

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Angular/ANTP-products
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Angular/ANTP-products/package-lock.json

      - name: Install current Angular 22 tree
        run: npm ci

      - name: Migrate to the esbuild/Vite application builder
        run: npx ng update @angular/cli --name use-application-builder --allow-dirty

      - name: Apply non-breaking audit fixes
        run: npm audit fix --ignore-scripts || true

      - name: Verify clean install, build and audit
        run: |
          rm -rf node_modules
          npm ci
          npm run build
          npm audit || true

      - name: Commit builder migration
        working-directory: .
        run: |
          if git diff --quiet -- Angular/ANTP-products; then
            echo "No builder migration changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Angular/ANTP-products
          git commit -m "chore(deps): adopt Angular application builder"
          git push
