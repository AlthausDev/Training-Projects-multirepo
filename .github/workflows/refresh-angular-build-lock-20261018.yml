name: Resolve Angular build patched dependencies (maintenance)

on:
  push:
    branches:
      - maintenance/upgrade-angular-build-22-2-2-20261018

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Angular/ANTP-products
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node.js supported by Angular 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: Angular/ANTP-products/package-lock.json
      - name: Regenerate lockfile with npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify patched dependency graph
        run: |
          node - <<'JS'
          const lock = require('./package-lock.json');
          const names = Object.entries(lock.packages).filter(([name]) => /(^|\/)piscina$/.test(name));
          if (!names.length) throw new Error('No piscina package in lockfile');
          for (const [name, info] of names) {
            console.log(name, info.version);
            const majorMinor = info.version.split('.').map(Number);
            if (majorMinor[0] < 5 || majorMinor[0] === 5 && majorMinor[1] < 3) {
              throw new Error('Potentially vulnerable piscina remains: ' + info.version);
            }
          }
          const build = lock.packages['node_modules/@angular/build'];
          if (!build || !build.version.startsWith('22.2.')) throw new Error('Unexpected Angular build version');
          if (build.dependencies.piscina !== '5.3.2') throw new Error('Unexpected Angular build pinned piscina');
          JS
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit regenerated lockfile to maintenance branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): regenerate npm lockfile for patched Angular build"
            git push origin HEAD:maintenance/upgrade-angular-build-22-2-2-20261018
          fi
