name: JasperReports 7 smoke test

on:
  push:
    branches:
      - security/jasperreports-7.0.7

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: C#-GUI-Frameworks/VITP.14-TestInform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: C#-GUI-Frameworks/VITP.14-TestInform/pom.xml

      - name: Compile project
        run: mvn -B -ntp clean package

      - name: Build runtime classpath
        run: mvn -B -ntp dependency:build-classpath -Dmdep.outputFile=cp.txt

      - name: Smoke test existing compiled report
        run: |
          java -cp "target/classes:$(cat cp.txt)" com.althaus.dev.AppLauncher
          test -s src/main/java/com/althaus/dev/export/Clientes.pdf
