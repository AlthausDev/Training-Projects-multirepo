name: Refresh Angular lockfile

on:
  push:
    branches:
      - security/angular19-dependency-refresh
    paths:
      - Angular/ANTP-products/package.json

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Angular/ANTP-products
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Angular/ANTP-products/package-lock.json

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Apply non-breaking audit fixes
        run: npm audit fix --package-lock-only --ignore-scripts || true

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit refreshed lockfile
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- Angular/ANTP-products/package-lock.json; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Angular/ANTP-products/package-lock.json
          git commit -m "chore(deps): apply Angular 19 security refresh"
          git push
