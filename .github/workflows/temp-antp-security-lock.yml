name: Temporary ANTP security lockfile regeneration
on:
  push:
    branches:
      - maintenance/antp-vite-security-20261030
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Angular/ANTP-products
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Angular/ANTP-products/package-lock.json
      - name: Regenerate lockfile with npm
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Apply compatible audit fixes
        run: |
          status=0
          npm audit fix --package-lock-only --ignore-scripts --no-fund || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - name: Pin exact resolved Angular versions in manifest
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const group of ['dependencies', 'devDependencies']) {
            for (const name of Object.keys(pkg[group] ?? {})) {
              if (!name.startsWith('@angular/')) continue;
              const resolved = lock.packages['node_modules/' + name]?.version;
              if (!resolved) throw new Error('Missing locked Angular package: ' + name);
              pkg[group][name] = resolved;
            }
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-fund
      - name: Clean installation
        run: npm ci --no-fund
      - name: Build Angular
        run: npm run build
      - name: Verify fixed Vite and Piscina
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json');
          for (const [name, minimum] of [['vite', '8.3.3'], ['piscina', '5.3.2']]) {
            const actual = lock.packages['node_modules/' + name]?.version;
            if (!actual) throw new Error('Missing dependency ' + name);
            const a = actual.split('.').map(Number), b = minimum.split('.').map(Number);
            if (a[0] < b[0] || (a[0] === b[0] && (a[1] < b[1] || (a[1] === b[1] && a[2] < b[2])))) {
              throw new Error(name + '@' + actual + ' is below patched ' + minimum);
            }
            console.log(name + '@' + actual + ' verified');
          }
          NODE
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Commit npm-generated dependency updates
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Angular/ANTP-products/package.json Angular/ANTP-products/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build: fijar Angular y regenerar lockfile seguro con npm"
          git push origin HEAD:maintenance/antp-vite-security-20261030
